<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitemap | TRoy Maritime Agency&trade;</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --bg: #071019;
      --bg2: #0c1c2b;
      --accent: #2fb6c9;
      --accent2: #e8b23d;
      --text: #e8eef2;
      --muted: #7a90a1;
      --border: #16283a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.7; }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 48px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; color: var(--accent); text-decoration: none; }
    .nav-logo img { width: 32px; height: 32px; border-radius: 50%; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px 100px; }
    h1 { font-size: 34px; color: var(--accent2); margin-bottom: 8px; }
    .updated { color: var(--muted); font-size: 13px; margin-bottom: 40px; }
    h2 { font-size: 20px; color: var(--text); margin: 36px 0 12px; }
    p, li { color: var(--text); opacity: 0.85; font-size: 15px; margin-bottom: 12px; }
    ul { padding-left: 22px; }
    a { color: var(--accent); }
    strong { color: var(--text); }
    footer { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><img src="/images/logo.png" alt="TRoy Maritime Agency&trade;" />TRoy Maritime Agency&trade;</a>
  </nav>
  <main>
    <h1>Sitemap</h1>
    <p class="updated">Last updated: 1 September 2026</p>
    
<h2>Pages</h2>
<ul>
<li><a href="/">Home</a></li>

<li><a href="/contact">Contact Us</a></li>
<li><a href="/terms">Terms of Service</a></li>
<li><a href="/privacy">Privacy Policy</a></li>
<li><a href="/cookies">Cookie Policy</a></li>
</ul>

  </main>
  <footer>
    TRoy Maritime Agency&trade; · <a href="mailto:agency@troymaritime.com">agency@troymaritime.com</a><br />
    ABN 30 302 098 137
  </footer>
</body>
</html>
